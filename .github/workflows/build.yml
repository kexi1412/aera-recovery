name: Build AERA Recovery (astonc)

on:
  workflow_dispatch:
    inputs:
      # Tuning parallelism used to require a commit, and a commit cancels or
      # queues the build that is already running. Exposing it here means "-j is
      # too high, lower it" costs one button press instead of another hour.
      jobs:
        description: 'Parallel jobs for mka (default 4, max 8)'
        required: false
        default: '4'
  push:
    branches: [main, aera-16.0]
    paths-ignore:
      - 'README.md'
      - '*.md'

permissions:
  contents: read

# Serialize builds per branch so several pushes do not all race through the
# same `repo sync`. `github.ref` keeps main and aera-16.0 independent.
#
# cancel-in-progress is FALSE on purpose. It was true, and it cost a real
# build: run #19 had been compiling for 1h23m when a later push superseded it
# and the runner reported "Canceling since a higher priority waiting request".
# AOSP compiles take the better part of an hour, so killing a running build to
# start a newer one throws away far more than it saves. Queue instead: the
# newer push waits its turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Set up vendor-blobs deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOBS_DEPLOY_KEY }}

      - name: Fetch vendor crypto blobs
        run: |
          # Proprietary QTI security ELFs (qseecomd, keymint, gatekeeper and
          # their lib closure) required for FBE decryption. They are OEM
          # binaries, so they live in the private astonc-vendor-blobs repo and
          # are injected here at build time. The device tree .gitignore keeps
          # recovery/root/vendor/bin and vendor/lib64 out of this public repo.
          git clone --depth 1 \
            git@github.com:kexi1412/astonc-vendor-blobs.git \
            "$RUNNER_TEMP/blobs"
          mkdir -p device_tree/recovery/root/vendor
          cp -a "$RUNNER_TEMP/blobs/vendor/." device_tree/recovery/root/vendor/
          echo "vendor/bin:"; ls device_tree/recovery/root/vendor/bin
          echo "vendor/bin/hw:"; ls device_tree/recovery/root/vendor/bin/hw
          echo "vendor/lib64 count: $(ls device_tree/recovery/root/vendor/lib64 | wc -l)"

      - name: Free disk space
        run: |
          # AOSP builds its own toolchain from prebuilts/, so the runner's
          # Android SDK and hosted toolcache are dead weight. Removing the whole
          # SDK rather than only sdk/ndk is worth roughly 10G more, which is the
          # difference between fitting and not: run 38100739430 died at ~1h with
          # "No space left on device" once the WiFi targets were added. (That
          # graph included rclone's Go build, which upstream has since dropped
          # for native SMB/SFTP, so the Wi-Fi tree is smaller today - the
          # cleanup stays because the root volume is still the tightest one.)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift || true
          sudo apt-get clean
          echo "=== after cleanup ==="
          df -h

      - name: Pick the build volume
        id: vol
        run: |
          # The AOSP tree plus out/ needs well over 60G, and run 38100739430
          # died at ~1h03m with "No space left on device" while the runner agent
          # wrote its own diagnostic log - the root volume was full.
          # AERA_ENABLE_WLAN had just pulled in wpa_supplicant_8, rclone's Go
          # build, libfuse and dhcptool, which were the last few GB.
          #
          # So build somewhere roomier. Three rules, learned the hard way:
          #   1. probe with sudo - /mnt and /home are root-owned mode 755, so
          #      mktemp as the runner user fails and every candidate is skipped.
          #      That is exactly what killed run 38106600296 in 0s.
          #   2. send diagnostics to stderr - anything on stdout is captured by
          #      $(...) and turns a numeric comparison into a syntax error.
          #   3. never fail the job here. If no candidate wins, fall back to the
          #      workspace and let the build itself report the problem. Actions
          #      runs this step as `bash -e`, so -e must be turned OFF first:
          #      otherwise any unexpected non-zero aborts the job outright.
          set +e
          set -u

          note() { echo "$@" >&2; }
          probe() {
            cand="$1"
            [ -d "$cand" ] || { note "$cand: absent"; return 1; }
            avail=$(df -Pk "$cand" 2>/dev/null | awk 'NR==2 {print $4}')
            case "$avail" in ''|*[!0-9]*) note "$cand: df unusable"; return 1;; esac

            # Returns 0 when a freshly written script on $cand actually runs.
            try_exec() {
              d=$(sudo mktemp -d "$cand/.execprobe.XXXXXX" 2>/dev/null) || return 1
              sudo chown "$(id -u):$(id -g)" "$d" 2>/dev/null || true
              printf '#!/bin/sh\nexit 0\n' > "$d/t.sh" 2>/dev/null || true
              chmod +x "$d/t.sh" 2>/dev/null || true
              "$d/t.sh" 2>/dev/null
              rc=$?
              sudo rm -rf "$d" 2>/dev/null || true
              return $rc
            }

            if try_exec; then
              exec_ok=yes
            else
              # A noexec volume would only surface much later as a baffling
              # compiler error. Try to repair it rather than give up, since
              # this is the one mount that actually has room.
              note "$cand: not executable; attempting remount with exec"
              sudo mount -o remount,exec "$cand" 2>/dev/null || true
              if try_exec; then
                exec_ok=yes; note "$cand: remount worked, exec=yes"
              else
                exec_ok=no;  note "$cand: still not executable, refusing"
              fi
            fi

            note "$cand: $((avail/1024/1024))GiB free, exec=$exec_ok"
            [ "$exec_ok" = yes ] || return 1
            printf '%s' "$avail"
          }

          echo "=== candidate volumes ==="
          df -h
          root_avail=$(df -Pk / 2>/dev/null | awk 'NR==2 {print $4}')
          case "$root_avail" in ''|*[!0-9]*) root_avail=0;; esac
          note "root (/): $((root_avail/1024/1024))GiB free"

          best=""
          other=""
          for cand in /mnt /home; do
            if cand_avail=$(probe "$cand"); then
              # Only accept a volume that is genuinely roomier than root;
              # /home sits on root, so this also rules it out when nothing
              # separate is mounted.
              if [ -z "$best" ] && [ "$cand_avail" -gt "$root_avail" ]; then
                best="$cand"; note "-> choosing $cand"
              elif [ -z "$other" ]; then
                # Keep a runner-up for the swapfile. Putting swap on the build
                # volume would have it compete with the tree for the same 60G.
                other="$cand"
              fi
            fi
          done

          if [ -n "$best" ]; then
            work="$best/aera-build"
            sudo mkdir -p "$work"
            sudo chown -R "$(id -u):$(id -g)" "$work"
          else
            note "::warning::no volume beat root; building in the workspace"
            work="$GITHUB_WORKSPACE/aera-build"
            mkdir -p "$work"
          fi
          mkdir -p "$work/tmp"

          # Swap goes on whichever volume is NOT chosen for the build. On
          # ubuntu-22.04 that is cosmetic: /mnt, /home and / all report the same
          # 115GiB free because all three are /dev/root, so swap competes with
          # the tree regardless. The observed warning "no volume beat root;
          # building in the workspace" is therefore expected, not a bug.
          #
          # An earlier revision of this comment used that fact to justify capping
          # swap at 8G. That cap is what killed run 38194850592 (swap pinned at
          # 8191MB, 1.0GB free RAM, exit 143 at +8.3m into the compile), so the
          # cap is gone and the Add swap step now asks for 16G - the size both
          # successful runs used - paying for it with the .repo removal rather
          # than with memory.
          swap_root="${other:-/home}"
          if [ "$swap_root" = "$best" ]; then swap_root=/home; fi

          {
            echo "root=${best:-/home}"
            echo "work=$work"
            echo "swap_root=$swap_root"
          } >> "$GITHUB_OUTPUT"
          echo "=== building in $work (swap on $swap_root) ===" | tee /dev/stderr
          df -h "$work" || df -h
          # Always succeed. The volume choice is an optimisation; a wrong guess
          # must never be the reason no image exists.
          exit 0

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            python3 python3-pip rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev openjdk-11-jdk
          git lfs install --skip-repo || true
          echo "ccache: $(ccache --version | head -1)"

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git and ccache
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global color.ui false
          # The AERA manifest declares the AERA remote over SSH
          # (ssh://git@github.com/AERA-Recovery). The repositories are public,
          # so rewrite to HTTPS.
          git config --global url."https://github.com/AERA-Recovery".insteadOf "ssh://git@github.com/AERA-Recovery"
          # ccache stays disabled on purpose: it only pays off when the cache
          # survives between runs, and GitHub caps a repository's cache at 10G
          # while an AOSP ccache is far larger. Enabling it here would just add
          # a 30G write onto the volume the build is already filling.
          ccache -z || true

      - name: Add swap
        run: |
          # systemd-oomd was one candidate for the silent death in run
          # 38134563574. Run 38194850592 has ruled it out: this step ran, printed
          # "systemd-oomd stopped (or absent)", and the job was still SIGTERMed
          # at step 16. Keep the stop - it costs nothing - but oomd was not the
          # cause, and the real one is visible in the heartbeat curve below
          # rather than in dmesg. See the swap sizing further down.
          #
          # That run reached 99% 130/131 of the Go bootstrap, printed nothing
          # for 337 seconds while soong_build analysed the tree - the most
          # memory-hungry phase of an AOSP build - and then died with
          # "Process completed with exit code 143" (SIGTERM) plus "The runner
          # has received a shutdown signal. This can happen when the runner
          # service is stopped". Disk was not the problem: 51GiB free before
          # compiling, 52G free when it started.
          #
          # The runner reported 15.6GB of RAM against AOSP's stated 16GB
          # minimum, and Ubuntu 22.04 enables systemd-oomd, which kills a whole
          # user slice when its memory pressure crosses a threshold. The GitHub
          # runner agent runs inside exactly such a slice, so an OOM reaper
          # shooting the agent is indistinguishable from a service stop: the
          # agent's own shutdown path is what prints that SIGTERM message.
          #
          # Steps 16-19 were skipped despite `if: always()`, which confirms the
          # kill came from outside the job - no step can run once the runner
          # agent itself is gone.
          sudo systemctl stop systemd-oomd systemd-oomd.socket 2>/dev/null || true
          sudo systemctl disable systemd-oomd systemd-oomd.socket 2>/dev/null || true
          if systemctl is-active --quiet systemd-oomd 2>/dev/null; then
            echo "::warning::systemd-oomd is still active; memory pressure may kill the runner"
          else
            echo "systemd-oomd stopped (or absent)"
          fi
          # Report the exact knob that remains, so the next run can be compared.
          cat /proc/pressure/memory 2>/dev/null || echo "no PSI memory pressure support"

          # Swap lives on $swap_root. Note that on ubuntu-22.04 that is NOT a
          # separate volume: the probe reports /mnt and /home both at the same
          # free space as / because all three are /dev/root, so an earlier
          # comment here claiming swap "lives on whichever volume the build is
          # NOT using" was wrong and is corrected. Swap therefore does compete
          # with the tree for space, and the number below has to be affordable.
          # Nothing here may fail the job: a missing swapfile only risks an OOM
          # later, whereas exiting now guarantees no image at all.
          swap_root="${{ steps.vol.outputs.swap_root }}"
          swap="$swap_root/swapfile"
          sudo swapoff -a || true
          sudo rm -f /swapfile "$swap" || true

          # HARD LESSON from run 38194850592 (sha b3fae9d, 2026-10-12). This
          # block used to request 8G, chosen in commit 5c5e8b0 to save disk when
          # .repo removal was being introduced. That run was SIGTERMed inside
          # step 16 with exit 143 exactly like the earlier ones, and because the
          # sampler is streamed the curve survived to say why:
          #
          #   heartbeat 0m00s | disk 52G | mem avail 14910MB | swap used    1MB
          #   heartbeat 2m00s | disk 51G | mem avail 12087MB | swap used    1MB
          #   heartbeat 4m00s | disk 51G | mem avail  1110MB | swap used 6136MB
          #   heartbeat 6m00s | disk 51G | mem avail  1039MB | swap used 7730MB
          #   heartbeat 8m00s | disk 51G | mem avail  1036MB | swap used 8191MB
          #   ##[error]Process completed with exit code 143.
          #
          # Disk never moved off 51G, so space was not the cause. Swap hit
          # 8191MB against an 8192MB file - the ceiling of this very variable -
          # while free memory sat at 1.0GB. The job died of memory exhaustion in
          # the soong_build analysis phase, the same 130/131 point that killed
          # run 38134563574.
          #
          # The two failure modes are now both measured and they need opposite
          # fixes, which is why this comment is long:
          #
          #   run 38194850592 (sha b3fae9d, .repo removed, 8G swap)
          #     MEMORY. Died +8.3m into the compile, swap pinned at its 8191MB
          #     ceiling, 1.0GB free RAM, disk steady at 51G.
          #
          #   run 38100739430 (sha 38100739, no .repo removal, 16G swap)
          #     DISK. Died at 23819/29834 (79%) after 94m and its job annotation
          #     is the proof - the runner agent failing to write its own log:
          #       System.IO.IOException: No space left on device :
          #       '/home/runner/actions-runner/cached/2.337.0/_diag/...log'
          #     Without the .repo removal it carried the extra 18G git object
          #     store on top of tree + 16G swap and the volume filled. That is
          #     why the .repo removal step exists.
          #
          # That same run is the proof that 16G swap is ENOUGH for the WLAN
          # build. It had the full Wi-Fi graph - 29834 tasks including
          # external/wpa_supplicant_8 and rclone, versus 28452 without Wi-Fi -
          # and it cleared the soong bootstrap at 130/131 that killed b3fae9d,
          # then compiled to 79%. Memory was never its problem; only disk was.
          # Its "Swap: 15Gi 0B 15Gi" never moved.
          #
          # So the fix is to take the memory envelope from that run (16G swap,
          # the size both successful runs also used) and the disk fix from the
          # other (.repo removal), because they compose: rm -rf .repo frees 18G
          # while the larger swapfile only costs 8G.
          #
          # Headroom: 51GiB free before compiling was measured with .repo removed
          # and an 8G swapfile, so the same build with a 16G swapfile has ~43G.
          # The disk-death configuration had the 18G .repo object store instead
          # of that headroom, which is what made the difference between the two
          # runs. Both fixes therefore reinforce rather than trade against each
          # other, and no earlier measurement showed out/ for a recovery-only
          # build ever approaching 43G.
          #
          # The caps below remain the safety net: on a smaller volume they shrink
          # swap and warn instead of letting the build wedge on disk space, which
          # keeps the failure mode OOM - recoverable by retrying - rather than
          # a full volume that no retry can fix.
          avail_k=$(df -Pk "$swap_root" 2>/dev/null | awk 'NR==2 {print $4}')
          case "$avail_k" in ''|*[!0-9]*) avail_k=0;; esac
          want_k=$(( 16 * 1024 * 1024 ))
          quarter_k=$(( avail_k / 4 ))
          head_k=$(( avail_k - 8*1024*1024 ))
          # Written as if/else rather than `[ .. ] && x=..` on purpose: Actions
          # runs run: blocks under `bash -e`, and a bare AND-list that
          # short-circuits is a needless game of chicken with errexit.
          if [ "$head_k" -lt 0 ]; then head_k=0; fi
          if [ "$quarter_k" -lt "$head_k" ]; then cap_k=$quarter_k; else cap_k=$head_k; fi
          if [ "$want_k" -gt "$cap_k" ]; then want_k=$cap_k; fi
          want_mb=$(( want_k / 1024 ))
          echo "swap: $swap_root has $((avail_k/1024/1024))GiB free -> requesting ${want_mb}MiB"

          if [ "$want_mb" -ge 1024 ]; then
            if ! sudo fallocate -l "${want_mb}M" "$swap" 2>/dev/null; then
              sudo dd if=/dev/zero of="$swap" bs=1M count="$want_mb" 2>/dev/null || true
            fi
            if [ -s "$swap" ]; then
              sudo chmod 600 "$swap"
              sudo mkswap "$swap" >/dev/null 2>&1 || true
              sudo swapon "$swap" 2>/dev/null || echo "::warning::swap could not be enabled"
            else
              echo "::warning::swapfile was not created"
            fi
          else
            echo "::warning::too little room for a useful swapfile; continuing without swap"
          fi
          free -h
          df -h

      - name: Repo init and sync (AERA manifest, aera-16.0)
        run: |
          mkdir -p "${{ steps.vol.outputs.work }}/aera"
          cd "${{ steps.vol.outputs.work }}/aera"
          repo init -u https://github.com/AERA-Recovery/android_manifest.git \
            -b aera-16.0 --git-lfs --depth=1
          repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc --all)"
          df -h

      - name: Drop the repo object store
        run: |
          cd "${{ steps.vol.outputs.work }}/aera"
          # On ubuntu-22.04 /mnt and /home share the root filesystem, so there
          # is no second volume to escape to - the build must simply use less
          # disk. .repo is the whole manifest's git object store and is pure
          # overhead once the working trees exist: nothing in the build reads
          # it. This is the single biggest reclaim available.
          echo "--- before ---"
          du -sh .repo 2>/dev/null || true
          df -h .
          rm -rf .repo
          echo "--- after ---"
          df -h .
          # The only consumers of per-project git metadata are two cosmetic
          # version strings (Android.mk:251 TW_GIT_REVISION, aera_build.mk:54
          # OF_CURRENT_BRANCH). Both already tolerate a failure with
          # 2>/dev/null, so a missing store degrades the version string and
          # nothing else. Confirm that instead of assuming it.
          git -C bootable/recovery rev-parse --short=8 HEAD 2>/dev/null \
            && echo "note: per-project git still works" \
            || echo "note: per-project git is gone; version string will be empty"

      - name: Install device tree
        run: |
          cd "${{ steps.vol.outputs.work }}/aera"
          rm -rf device/oneplus/astonc
          mkdir -p device/oneplus
          cp -a "$GITHUB_WORKSPACE/device_tree" device/oneplus/astonc
          rm -rf device/oneplus/astonc/.github device/oneplus/astonc/.git
          ls device/oneplus/astonc

      - name: Preflight the Wi-Fi build dependencies
        run: |
          # aera_build.mk hard-errors on missing wpa_supplicant_8 sources only
          # once OF_ENABLE_WLAN is set -- i.e. deep inside the compile, hours
          # from now. Check the two manifest-provided trees now, while a
          # failure costs seconds instead of the whole build window.
          aera="${{ steps.vol.outputs.work }}/aera"
          fail=0
          for d in external/wpa_supplicant_8/Android.bp external/libfuse; do
            if [ -e "$aera/$d" ]; then
              echo "  present: $d"
            else
              echo "::error::$aera/$d is missing from the synced tree; the Wi-Fi targets cannot build"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "wpa_supplicant_8 and libfuse are synced for the Wi-Fi targets"

      - name: Verify the kernel module and Wi-Fi configuration
        run: |
          # Feature gate. The Wi-Fi stack cannot come up unless three coupled
          # things are configured at once -- the module loader gate
          # (TW_LOAD_VENDOR_MODULES), the Wi-Fi compile gate (OF_ENABLE_WLAN)
          # and the ramdisk hook -- and each one fails silently on its own:
          #   * a missing module list compiles kernel_module_loader.cpp out,
          #     so nothing ever loads the QCA6490 stack and wlan0 never
          #     appears;
          #   * a missing OF_ENABLE_WLAN still loads the modules but stages no
          #     supplicant, which presents as "Wi-Fi does not work" rather
          #     than as a missing feature;
          #   * a missing init.recovery.wifi.rc leaves sys.aera.wlan.up
          #     unconsumed, so nothing ever starts the supplicant service.
          # Only a check that sees all three together catches a half-apply,
          # and a half-apply presents as a hang or a missing feature, never
          # as a build failure. This tree has made that mistake in both
          # directions (5d614cd added Wi-Fi, dc9122f removed it); the gate
          # runs before a multi-hour build for exactly that reason.
          #
          # Every check reads the extracted value of an assignment, never the
          # whole file: the surrounding commentary names all of these variables
          # in prose, so a file-wide grep would keep passing after an
          # assignment had been dropped.
          dt="$GITHUB_WORKSPACE/device_tree"
          bc="$dt/BoardConfig.mk"
          am="$dt/aera_astonc.mk"
          fail=0

          # 1. The recovery module loader must stay out of the build entirely.
          #    Run #34 proved its runtime security-patch override breaks the
          #    metadata-encryption unwrap on this device (KeyMint evaluates
          #    the OS patch level per operation; the loader resetprops it
          #    from the pinned 2026-09-01 to the ROM's 2026-10-01 after
          #    keymint started), and its teardown unmounts /vendor with the
          #    modem firmware under it. With both gate variables unset,
          #    Android.mk:369 compiles kernel_module_loader.cpp out.
          if grep -qE '^[[:space:]]*TW_LOAD_VENDOR_MODULES[[:space:]]*:?=' "$bc"; then
            echo "::error::BoardConfig.mk still sets TW_LOAD_VENDOR_MODULES; the loader breaks decrypt on this device (run #34 evidence)"
            fail=1
          fi
          if grep -qE '^[[:space:]]*TW_POST_DECRYPT_MODULES[[:space:]]*:?=' "$bc"; then
            echo "::error::BoardConfig.mk still sets TW_POST_DECRYPT_MODULES; module loading is owned by init.recovery.qcom.rc now"
            fail=1
          fi

          # 2. The driver bring-up lives in init.recovery.qcom.rc's
          #    post-fs-data block, with the ordering the live adb session
          #    established: ADSP stack (charger/gauge ICs ride its glink),
          #    modem start (cnss2 needs the DMS QMI service for the factory
          #    WLAN MAC), QCA6490 stack, and fs_ready written before the USB
          #    gadget is configured.
          qr="$dt/recovery/root/init.recovery.qcom.rc"
          for m in q6_pdr_dlkm.ko q6_notifier_dlkm.ko snd_event_dlkm.ko \
                   gpr_dlkm.ko spf_core_dlkm.ko adsp_loader_dlkm.ko \
                   cnss_prealloc.ko cnss_utils.ko cnss_plat_ipc_qmi_svc.ko \
                   wlan_firmware_service.ko cnss_nl.ko cnss2.ko \
                   qca_cld3_kiwi_v2.ko; do
            if ! grep -qF "insmod /vendor_dlkm/lib/modules/$m" "$qr"; then
              echo "::error::init.recovery.qcom.rc does not insmod /vendor_dlkm/lib/modules/$m (the only module directory on this device)"
              fail=1
            fi
          done
          for need in 'symlink /vendor/firmware_mnt/image /lib/firmware' \
                      'write /sys/kernel/boot_adsp/boot 1' \
                      'write /sys/class/remoteproc/remoteproc3/state start' \
                      'write /sys/kernel/cnss/fs_ready 1'; do
            if ! grep -qF "$need" "$qr"; then
              echo "::error::init.recovery.qcom.rc is missing: $need"
              fail=1
            fi
          done
          # The ADSP boot must precede the modem start and both must precede
          # the fs_ready write inside the post-fs-data block.
          adsp=$(grep -n 'write /sys/kernel/boot_adsp/boot 1' "$qr" | cut -d: -f1)
          modem=$(grep -n 'write /sys/class/remoteproc/remoteproc3/state start' "$qr" | cut -d: -f1)
          fsr=$(grep -n 'write /sys/kernel/cnss/fs_ready 1' "$qr" | cut -d: -f1)
          if [ -z "$adsp" ] || [ -z "$modem" ] || [ -z "$fsr" ] || [ "$adsp" -ge "$modem" ] || [ "$modem" -ge "$fsr" ]; then
            echo "::error::init.recovery.qcom.rc ordering wrong: boot_adsp ($adsp) < modem start ($modem) < fs_ready ($fsr) required"
            fail=1
          fi

          # 3. The obsolete module-loader era artifacts must stay gone.
          if [ -e "$dt/recovery/root/system/bin/beforemodules.sh" ]; then
            echo "::error::recovery/root/system/bin/beforemodules.sh is back; the loader it serves is compiled out"
            fail=1
          fi
          if [ -e "$dt/scripts/fix-post-decrypt-stage.py" ]; then
            echo "::error::scripts/fix-post-decrypt-stage.py is back; module staging is owned by init now"
            fail=1
          fi

          # 6. The Wi-Fi backend must be enabled with the literal 1.
          #    bootable/recovery/Android.mk:75 and aera_build.mk:876 both
          #    compare with `ifeq (...,1)`, so `true` compiles the Wi-Fi
          #    sources out just as effectively as leaving it unset. Without
          #    this, wlan0 is brought up by the modules but nothing ever
          #    starts the supplicant.
          if ! grep -qE '^[[:space:]]*OF_ENABLE_WLAN[[:space:]]*:?=[[:space:]]*1[[:space:]]*$' "$bc"; then
            echo "::error::BoardConfig.mk does not set OF_ENABLE_WLAN to the literal 1; the Wi-Fi sources will not be compiled and no supplicant will be staged"
            fail=1
          fi
          if ! grep -qE '^[[:space:]]*AERA_ENABLE_WLAN[[:space:]]*:?=[[:space:]]*1[[:space:]]*$' "$am"; then
            echo "::error::aera_astonc.mk does not set AERA_ENABLE_WLAN to the literal 1; the public interface value has drifted"
            fail=1
          fi

          # 7. The Wi-Fi ramdisk pieces must all be present together: the
          #    bring-up script (wpa_supplicant service + the sys.aera.wlan.up
          #    handler), its import, the firmware search path that resolves
          #    kiwi/amss.bin and wlan/WCNSS_qcom_cfg.ini, and the persist
          #    mount that supplies that ini.
          if [ ! -f "$dt/recovery/root/init.recovery.wifi.rc" ]; then
            echo "::error::recovery/root/init.recovery.wifi.rc is missing; sys.aera.wlan.up would be unconsumed"
            fail=1
          fi
          if ! grep -qs 'import /init.recovery.wifi.rc' "$dt/recovery/root/init.recovery.qcom.rc"; then
            echo "::error::init.recovery.qcom.rc no longer imports /init.recovery.wifi.rc; init would never parse it"
            fail=1
          fi
          if ! grep -q '/mnt/vendor/persist/' "$dt/recovery/root/vendor/etc/ueventd.rc"; then
            echo "::error::ueventd.rc lost the /mnt/vendor/persist firmware directory; kiwi firmware and the supplicant ini would not resolve"
            fail=1
          fi
          if ! grep -q '/dev/block/by-name/persist[[:space:]]/mnt/vendor/persist' "$dt/recovery/root/system/etc/recovery.fstab"; then
            echo "::error::recovery.fstab lost the persist entry; wlan/WCNSS_qcom_cfg.ini would be unmountable"
            fail=1
          fi

          # 8. Upstream must still contain the gates and the wlan.cpp
          #    contract this configuration relies on. If AERA renames them,
          #    the configuration has to be re-derived rather than silently
          #    doing nothing.
          bb="${{ steps.vol.outputs.work }}/aera"
          if ! grep -q 'TW_LOAD_VENDOR_MODULES' "$bb/bootable/recovery/Android.mk"; then
            echo "::error::bootable/recovery/Android.mk no longer gates on TW_LOAD_VENDOR_MODULES"
            fail=1
          fi
          if ! grep -qE 'ifeq[[:space:]]*\(\$\(OF_ENABLE_WLAN\),1\)' "$bb/bootable/recovery/aera_build.mk"; then
            echo "::error::aera_build.mk no longer gates the Wi-Fi targets on OF_ENABLE_WLAN==1"
            fail=1
          fi
          if ! grep -q 'sys.aera.wlan.up' "$bb/bootable/recovery/wlan.cpp"; then
            echo "::error::wlan.cpp no longer raises sys.aera.wlan.up; init.recovery.wifi.rc's handler would never fire"
            fail=1
          fi

          # 9. No module-list variable may reappear in either config file:
          #    the loader they feed is compiled out and init owns loading.
          if grep -qE '^[[:space:]]*(AERA_LOAD_VENDOR_MODULES|AERA_POST_DECRYPT_MODULES)[[:space:]]*:?=' "$am"; then
            echo "::error::aera_astonc.mk still assigns a module-list variable (AERA_LOAD_VENDOR_MODULES / AERA_POST_DECRYPT_MODULES); module loading is owned by init.recovery.qcom.rc"
            fail=1
          fi

          # 10. The super flash table must stay in agreement with the fstab.
          #     The manual flash-image list is derived from the recovery
          #     fstab's `logical` entries (TWFLAG_LOGICAL -> Is_Super ->
          #     aera_flashimg), so a partition present in only one of the two
          #     either silently disappears from the flash UI or is offered
          #     without a mount. The verified set is the full 18-way PLK110
          #     super group -- system system_ext product vendor odm
          #     system_dlkm vendor_dlkm odm_dlkm plus the ten my_* vendor
          #     partitions -- and both files must carry exactly it.
          fstab="$dt/recovery/root/system/etc/recovery.fstab"
          board_list=$(grep -E '^BOARD_QTI_DYNAMIC_PARTITIONS_PARTITION_LIST[[:space:]]*:?=' "$bc" \
            | head -1 | sed 's/^.*:=//' | tr ' ' '\n' | grep -v '^$' | sort | tr '\n' ' ')
          fstab_list=$(grep -vE '^[[:space:]]*#' "$fstab" | grep -w logical \
            | awk '{print $1}' | sort | tr '\n' ' ')
          n_board=$(printf '%s' "$board_list" | wc -w)
          n_fstab=$(printf '%s' "$fstab_list" | wc -w)
          if [ "$n_board" -ne 18 ]; then
            echo "::error::BOARD_QTI_DYNAMIC_PARTITIONS_PARTITION_LIST must carry the 18-way super group, found $n_board: $board_list"
            fail=1
          fi
          if [ "$n_fstab" -ne 18 ]; then
            echo "::error::recovery.fstab must declare exactly 18 logical entries (the manual flash-image list derives from them), found $n_fstab: $fstab_list"
            fail=1
          fi
          if [ "$board_list" != "$fstab_list" ]; then
            echo "::error::the super partition list and the fstab logical entries disagree"
            echo "::error::  BoardConfig.mk : $board_list"
            echo "::error::  recovery.fstab  : $fstab_list"
            fail=1
          fi

          # 11. The VINTF fix is what makes recovery decrypt, and it is
          #     invisible until a device boots with an encrypted /data:
          #     keystore2 aborts, the image still flashes and still boots.
          #     Assert the wiring here instead of discovering it after a
          #     flash. This is the check whose absence cost the most.
          if ! grep -q 'fix-recovery-vintf\.py' "$bc"; then
            echo "::error::BoardConfig.mk no longer runs scripts/fix-recovery-vintf.py; recovery will not decrypt"
            fail=1
          fi
          if [ ! -f "$dt/scripts/fix-recovery-vintf.py" ]; then
            echo "::error::scripts/fix-recovery-vintf.py is missing"
            fail=1
          fi

          # 12. Root Manager is opt-in upstream and this device has to opt in.
          #
          #     Upstream 2782981 replaced AERA_ENABLE_KERNELSU_SUPPORT,
          #     AERA_ENABLE_KERNELSU_NEXT_SUPPORT and AERA_ENABLE_SUKISU_SUPPORT
          #     with the single AERA_ENABLE_ROOT_MANAGER and defaulted it to 0 in
          #     aera_config.mk:7. The three old names are read nowhere now, so a
          #     device tree that still exports only those builds a recovery whose
          #     Menu silently omits the Root Manager row
          #     (tool_scene.cpp: `if (item.action == Action::kRootManager &&
          #     !root::Enabled()) continue;`) and whose ramdisk omits
          #     system/etc/aera/root-providers entirely.
          #
          #     That failure is invisible in every other check: the image builds,
          #     flashes and boots, and the only symptom is a missing row.
          if ! grep -qE '^[[:space:]]*AERA_ENABLE_ROOT_MANAGER[[:space:]]*:?=[[:space:]]*1[[:space:]]*$' "$am"; then
            echo "::error::aera_astonc.mk does not set AERA_ENABLE_ROOT_MANAGER := 1; the Menu will omit Root Manager"
            grep -nE '^[[:space:]]*AERA_ENABLE_ROOT_MANAGER' "$am" || echo "  (no assignment at all)"
            fail=1
          fi
          # The superseded names must be gone, not merely accompanied: leaving
          # them implies they still do something.
          for stale in AERA_ENABLE_KERNELSU_SUPPORT \
                       AERA_ENABLE_KERNELSU_NEXT_SUPPORT \
                       AERA_ENABLE_SUKISU_SUPPORT; do
            if grep -rqE "^[[:space:]]*(export[[:space:]]+)?${stale}[[:space:]]*:?=" "$dt"; then
              echo "::error::$stale is read by nothing upstream (2782981); AERA_ENABLE_ROOT_MANAGER replaced it"
              grep -rnE "^[[:space:]]*(export[[:space:]]+)?${stale}[[:space:]]*:?=" "$dt" || true
              fail=1
            fi
          done
          # And the build-time Menu revert has to be wired, or the row comes
          # back as PC connection even though Root Manager returned.
          if [ ! -f "$dt/scripts/restore-menu-language.py" ]; then
            echo "::error::scripts/restore-menu-language.py is missing; Menu slot 9 will stay PC connection"
            fail=1
          fi

          # 13. Report what is configured, so the values are in the log even
          #     on success.
          echo "--- Wi-Fi switches (want OF/AERA_ENABLE_WLAN only; no module lists) ---"
          grep -nE '^[[:space:]]*(TW_LOAD_VENDOR_MODULES|TW_LOAD_VENDOR_MODULES_EXCLUDE_GKI|TW_POST_DECRYPT_MODULES|OF_ENABLE_WLAN)[[:space:]]*:?=' "$bc" || echo "  (none in BoardConfig.mk)"
          grep -nE '^[[:space:]]*(AERA_LOAD_VENDOR_MODULES|AERA_LOAD_VENDOR_MODULES_EXCLUDE_GKI|AERA_POST_DECRYPT_MODULES|AERA_ENABLE_WLAN)[[:space:]]*:?=' "$am" || echo "  (none in aera_astonc.mk)"
          echo "--- init-owned driver bring-up (post-fs-data sequence) ---"
          grep -nE 'insmod /vendor_dlkm|boot_adsp|remoteproc3|cnss/fs_ready|firmware_mnt/image /lib/firmware' "$dt/recovery/root/init.recovery.qcom.rc" || echo "  (none)"
          echo "--- vintf preparation hook ---"
          grep -n 'fix-recovery-vintf\.py' "$bc" || true
          echo "--- root manager switch (want AERA_ENABLE_ROOT_MANAGER := 1) ---"
          grep -nE '^[[:space:]]*AERA_ENABLE_ROOT_MANAGER[[:space:]]*:?=' "$am" "$dt/vendorsetup.sh" \
            || echo "  (none)"
          echo "--- superseded root switches (want none) ---"
          grep -rnE '^[[:space:]]*(export[[:space:]]+)?AERA_ENABLE_(KERNELSU|KERNELSU_NEXT|SUKISU)_SUPPORT[[:space:]]*:?=' "$dt" \
            || echo "  (none)"
          echo "--- menu revert helper (want present) ---"
          ls -l "$dt/scripts/restore-menu-language.py" || true

          if [ "$fail" -ne 0 ]; then
            echo "::error::the build configuration is wrong (kernel modules, Wi-Fi, VINTF fix or Root Manager); refusing to start a multi-hour build"
            exit 1
          fi
          echo "kernel module + Wi-Fi configuration OK; VINTF fix wired; Root Manager enabled"

      - name: Apply upstream source fixes
        run: |
          cd "${{ steps.vol.outputs.work }}/aera"
          # AERA's partitionmanager.cpp references AID_MEDIA_RW without
          # including the header that declares it (data.cpp and
          # twrp-functions.cpp, which use the same symbol, both include it).
          # Reported by run #2 (37608320847): "use of undeclared identifier
          # 'AID_MEDIA_RW'" at partitionmanager.cpp:1632 and :5401.
          f=bootable/recovery/partitionmanager.cpp
          if ! grep -q 'android_filesystem_config.h' "$f"; then
            sed -i '0,/^#include <fstab\/fstab.h>/s//#include <private\/android_filesystem_config.h>\n#include <fstab\/fstab.h>/' "$f"
            echo "patched $f:"
            grep -n 'android_filesystem_config.h' "$f"
          else
            echo "$f already includes android_filesystem_config.h"
          fi

          # aera_build.mk note, 2026-10: the Wi-Fi block no longer carries
          # rclone_prebuilt (upstream replaced the NAS backend with native
          # SMB/SFTP via aera-netfs), and fusermount3 stayed because the native
          # FUSE workers need it. The old build-time sed that deleted
          # rclone_prebuilt/fusermount3 from this block is therefore gone; the
          # Wi-Fi graph is correspondingly smaller than what run 38100739430
          # measured, and nothing here trims upstream module lists any more.

          # Restore the Menu arrangement this device was verified against.
          #
          # Upstream b9eddda ("ui2: move PC Connection to Menu and Language to
          # Preferences") rewrote slot 9 of the hard-coded Menu array in
          # aeraui/scenes/tool_scene.cpp, replacing the Language row with a PC
          # connection row. Language survived, but only as a row inside
          # Preferences -- a different destination, and one this device's flow
          # does not use. The recovery repository is not one this project can
          # push to, so the revert happens here against the freshly synced tree.
          #
          # The helper asserts every assumption (single 12-row array, exactly
          # one PC row inside it, the Preferences Language row still present) and
          # refuses to guess if upstream reshapes the file. It is idempotent, so
          # a re-run after a partial failure is safe.
          python3 device/oneplus/astonc/scripts/restore-menu-language.py bootable/recovery

          # Re-check the result at the source level, which is the only place the
          # negative direction is observable: the PC row must be gone from the
          # Menu array while BuildPcConnection() and the PC pairing panel keep
          # their own copies of that description string.
          ts=bootable/recovery/aeraui/scenes/tool_scene.cpp
          if grep -qF 'Action::kPcConnection},' "$ts"; then
            echo "::error::tool_scene.cpp still has a kPcConnection Menu row after the revert"
            grep -nF 'Action::kPcConnection}' "$ts" || true
            exit 1
          fi
          if ! grep -qF '{"A", "Language", "Choose the recovery interface language", Action::kLanguage},' "$ts"; then
            echo "::error::the Menu Language row is not in tool_scene.cpp after the revert"
            exit 1
          fi
          if ! grep -qF 'PreferenceEntry(state, LV_SYMBOL_KEYBOARD, "Language"' "$ts"; then
            echo "::error::the Preferences Language entry is gone; upstream changed the language entry points again"
            exit 1
          fi
          echo "Menu slot 9 is the Language row; the Preferences Language entry is intact"

          # astonc: the status-bar battery read and the "restart in hardware
          # fastboot" path were both broken. Both are defects in the shared AERA
          # tree, not in this device's configuration, and neither can be fixed
          # from a BoardConfig variable, so both are patched here against the
          # freshly synced tree.
          #
          # Battery: aeraui/core/status_bar.cpp:515 reads
          # /sys/class/power_supply/battery/capacity with a single fopen/fscanf
          # and clamps the result into 0..100. On this device the gauge node
          # answers before the fuel gauge is initialised, and the 9008 kmsg dump
          # shows the health HAL needing 19 retries ("opened battery/capacity
          # after 19 retries") and healthd logging "battery none" eleven times.
          # Clamping that "not ready" answer turned it into a confident 0%, and
          # the status bar only re-read every ten ticks, so the bar sat at --%
          # for the whole window. The patch rejects out-of-range readings and
          # re-reads every tick until a plausible one arrives.
          python3 device/oneplus/astonc/scripts/fix-battery-read.py bootable/recovery

          sb=bootable/recovery/aeraui/core/status_bar.cpp
          if ! grep -qF 'capacity >= 0 && capacity <= 100' "$sb"; then
            echo "::error::status_bar.cpp does not range-check the battery reading"
            exit 1
          fi
          if grep -qF 'std::clamp(capacity, 0, 100)' "$sb"; then
            echo "::error::status_bar.cpp still clamps an unread battery into 0%"
            exit 1
          fi
          if ! grep -qF 'state->battery < 0 || state->ticks % 10 == 0' "$sb"; then
            echo "::error::the status bar does not poll every tick while the battery is unread"
            exit 1
          fi
          # v2: the diagnostics that report the gauge's behaviour from a
          # flashed device. A build without them cannot be triaged from logs.
          if ! grep -qF 'static int unreadable_polls = 0;' "$sb"; then
            echo "::error::status_bar.cpp is missing the unreadable-poll counter; the battery diagnostics did not reach the compile"
            exit 1
          fi
          if ! grep -qF '__android_log_print' "$sb"; then
            echo "::error::status_bar.cpp does not log battery diagnostics to logcat"
            exit 1
          fi
          if ! grep -qF '#include <android/log.h>' "$sb"; then
            echo "::error::status_bar.cpp is missing <android/log.h>; the diagnostics would not compile"
            exit 1
          fi
          echo "Battery read range-checked, polled while unread, and self-reporting"

          # Reboot: tw_reboot()'s rb_bootloader and rb_fastboot cases requested
          # the reboot without clearing the BCB first. init queues that request
          # through write_reboot_bootloader(), which refuses to touch misc while
          # a command is still pending ("Bootloader command pending.") and then
          # drops the request, so the device flashed the transition screen and
          # stayed in recovery. rb_system already cleared it; these two did not.
          python3 device/oneplus/astonc/scripts/fix-reboot-fastboot.py bootable/recovery

          tr=bootable/recovery/twrp-functions.cpp
          if ! grep -qF 'case rb_bootloader:' "$tr"; then
            echo "::error::the rb_bootloader case is gone from twrp-functions.cpp"
            exit 1
          fi
          # The clear must sit inside both fastboot-related cases, so assert it
          # appears exactly three times: rb_system (upstream) plus the two added
          # here. A count catches a silent reordering as well as a missing call.
          n=$(grep -cF 'Clear_Bootloader_Message();' "$tr")
          if [ "$n" -ne 3 ]; then
            echo "::error::expected 3 Clear_Bootloader_Message() calls in twrp-functions.cpp, found $n"
            exit 1
          fi
          if ! grep -qF 'return request_power_control("reboot,bootloader");' "$tr" ||
             ! grep -qF 'return request_power_control("reboot,fastboot");' "$tr"; then
            echo "::error::the reboot requests themselves were lost while clearing the BCB"
            exit 1
          fi
          # v2: the 15 s direct-reboot watchdog must be defined exactly once
          # and armed from both fastboot-related cases, with the definition
          # preceding its first call (C++ has no forward visibility without a
          # header declaration).
          if [ "$(grep -cF 'void Astonc_Reboot_Watchdog(const char *bcb_command) {' "$tr")" -ne 1 ]; then
            echo "::error::the reboot watchdog function is not defined exactly once in twrp-functions.cpp"
            exit 1
          fi
          if [ "$(grep -cF 'Astonc_Reboot_Watchdog("' "$tr")" -ne 2 ]; then
            echo "::error::the reboot watchdog must be armed from exactly 2 call sites"
            exit 1
          fi
          if ! grep -qF 'Astonc_Reboot_Watchdog("bootonce-bootloader");' "$tr" ||
             ! grep -qF 'Astonc_Reboot_Watchdog("boot-fastboot");' "$tr"; then
            echo "::error::the watchdog calls lost their BCB commands"
            exit 1
          fi
          wd_def=$(grep -nF 'void Astonc_Reboot_Watchdog(const char *bcb_command) {' "$tr" | cut -d: -f1)
          wd_call=$(grep -nF 'Astonc_Reboot_Watchdog("bootonce-bootloader");' "$tr" | cut -d: -f1)
          if [ -z "$wd_def" ] || [ -z "$wd_call" ] || [ "$wd_def" -ge "$wd_call" ]; then
            echo "::error::the watchdog definition must precede its first call (def=$wd_def call=$wd_call)"
            exit 1
          fi
          echo "rb_bootloader and rb_fastboot clear the BCB, request the reboot, and arm the 15 s watchdog"

          # fastbootd: the device tree has to own the fastboot gadget bind,
          # because the shared upstream action never unbinds the UDC first and
          # dies on this device with "symlink() failed: File exists" and
          # "Device or resource busy" (9008 kmsg, /init.recovery.usb.rc:100-101).
          # Path caveat: this step runs with cwd = "$work/aera" (the AOSP tree),
          # where "device_tree/" does not exist -- that is the checkout directory
          # name and lives under $GITHUB_WORKSPACE. "Install device tree" copies
          # it to device/oneplus/astonc, so assert against the installed copy.
          # Reading device_tree/... here failed with "has no fastbootd bind
          # handler" on every run while the file was in fact correct (run #32).
          usbrc=device/oneplus/astonc/recovery/root/init.recovery.usb.rc
          if ! grep -qF 'on property:sys.usb.config=fastboot && property:sys.usb.ffs.ready=1 && property:sys.usb.configfs=1' "$usbrc"; then
            echo "::error::$usbrc has no fastbootd bind handler"
            exit 1
          fi
          if ! grep -qF 'symlink /config/usb_gadget/g1/functions/ffs.fastboot /config/usb_gadget/g1/configs/b.1/f1' "$usbrc"; then
            echo "::error::$usbrc does not link ffs.fastboot into the gadget"
            exit 1
          fi
          if ! grep -qF 'idProduct 0x${ro.recovery.usb.fastboot.pid}' "$usbrc"; then
            echo "::error::$usbrc does not publish the fastboot idProduct"
            exit 1
          fi
          # The teardown must come before the bind, which is the whole point.
          first=$(grep -nF 'on property:sys.usb.config=fastboot' "$usbrc" | head -1 | cut -d: -f1)
          unbind=$(awk -v s="$first" 'NR>=s && /write \/config\/usb_gadget\/g1\/UDC none/ {print NR; exit}' "$usbrc")
          link=$(awk -v s="$first" 'NR>=s && /functions\/ffs\.fastboot .*\/f1$/ {print NR; exit}' "$usbrc")
          if [ -z "$unbind" ] || [ -z "$link" ] || [ "$unbind" -ge "$link" ]; then
            echo "::error::$usbrc must unbind the UDC before it symlinks ffs.fastboot (unbind=$unbind link=$link)"
            exit 1
          fi
          # MTP must survive: it is the only working file transfer on this build.
          for h in 'config=mtp,adb' 'config=mtp &&'; do
            if ! grep -qF "on property:sys.usb.ffs.mtp.ready=1 && property:sys.usb.$h" "$usbrc" &&
               ! grep -qF "on property:sys.usb.$h" "$usbrc"; then
              echo "::error::$usbrc lost the MTP handler for $h"
              exit 1
            fi
          done
          echo "fastbootd bind owns the gadget teardown; the MTP handlers are intact"

          # Power handoff: the BCB fix above lets init *accept* the reboot
          # request, but the graphics thread still has to *deliver* it. On this
          # device the early UI thread runs Adreno EGL TLS destructors on exit,
          # and that teardown blocks inside the vendor library before the
          # recovery core can call request_power_control(). The device flashes
          # the transition screen and stays in recovery exactly as before -- same
          # symptom, one layer deeper.
          #
          # Ported from KAI-Miru/android_device_oneplus_guacamole-AERA 8e9db27:
          # terminal actions (reboot/bootloader/fastboot/power-off) hand their
          # result to the recovery backend through a condition variable while
          # the graphics thread parks in pause() instead of exiting. init then
          # receives the power request and reboots; the thread dies with the
          # process.
          python3 device/oneplus/astonc/scripts/fix-power-handoff.py bootable/recovery

          runner=bootable/recovery/aeraui/core/runner.cpp
          if ! grep -qF 'bool IsTerminalResult(RunResult result)' "$runner"; then
            echo "::error::IsTerminalResult helper is missing from runner.cpp"
            exit 1
          fi
          if ! grep -qF 'gEarlyCondition' "$runner"; then
            echo "::error::gEarlyCondition condition variable is missing from runner.cpp"
            exit 1
          fi
          if ! grep -qF 'gEarlyFinished' "$runner"; then
            echo "::error::gEarlyFinished flag is missing from runner.cpp"
            exit 1
          fi
          if ! grep -qF 'for (;;) pause();' "$runner"; then
            echo "::error::the pause() keep-alive loop is missing from runner.cpp"
            exit 1
          fi
          if ! grep -qF 'terminal action handed off with graphics thread alive' "$runner"; then
            echo "::error::the power handoff marker string is missing from runner.cpp"
            exit 1
          fi
          if grep -qF 'bool run_inline = false;' "$runner"; then
            echo "::error::the old lock_guard join path survived in RunAeraUi"
            exit 1
          fi
          # The condition_variable wait must replace the old join, not sit
          # alongside it.
          n=$(grep -cF 'gEarlyCondition.wait' "$runner")
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one gEarlyCondition.wait in runner.cpp, found $n"
            exit 1
          fi
          echo "Terminal actions hand off with the graphics thread alive (pause loop)"

          # Module loading is owned by init.recovery.qcom.rc's post-fs-data
          # block (run #34 + the live adb session of 2026-10-24): the loader's
          # security-patch override broke metadata-encryption unwrapping and
          # its teardown unmounted /vendor. No build-time module patching
          # happens here any more; assert that no stale loader artifacts
          # came back instead.
          if grep -qF 'astonc: staging post-decrypt modules on demand' bootable/recovery/kernel_module_loader.cpp 2>/dev/null; then
            echo "::error::kernel_module_loader.cpp still carries the retired stage-on-demand patch; remove it (module loading is owned by init)"
            exit 1
          fi
          echo "Module loading owned by init.recovery.qcom.rc; no build-time module patching"

      - name: Build recovery
        env:
          # Passed through env rather than interpolated into the script, so a
          # value from the dispatch form can never become shell syntax.
          JOBS_INPUT: ${{ github.event.inputs.jobs }}
        run: |
          work="${{ steps.vol.outputs.work }}"
          cd "$work/aera"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          # Compiler scratch follows the build volume; /tmp lives on root, the
          # volume that ran out.
          export TMPDIR="$work/tmp"
          mkdir -p "$TMPDIR"

          # Capture the whole build to a file. The REST job-log endpoints for
          # this repo answer 401/404, so without a captured log every failure
          # can only be guessed at - and guessing has already cost several
          # runs. The tail of this file is echoed into the step output by the
          # next step, which survives even when the log download does not.
          log="$work/build.log"
          disklog="$work/disk.log"
          : > "$log"
          : > "$disklog"

          # Sample free space every two minutes for the whole compile, and
          # heartbeat to stdout as well. Every disk conclusion so far has been
          # inferred after the fact from a one-line error; this produces the
          # actual curve, so the next change is aimed at a measured number.
          #
          # The heartbeat matters for a second reason: soong's analysis phase
          # prints nothing for several minutes, so a healthy build and a hung
          # one are indistinguishable in the step output. Run 38134563574 was
          # SIGTERMed by the runner at 25m ("The runner has received a shutdown
          # signal", exit 143) and steps 16-19 never ran despite `if: always()`
          # - a killed runner executes no further steps. The step output is the
          # only thing that survives that, so it has to carry the evidence.
          #
          # Free memory is reported for the same reason. That run announced
          # "You are building on a machine with 15.6GB of RAM" against AOSP's
          # stated 16GB minimum, so an OOM kill is one candidate. The kernel
          # only says so in dmesg, which never reaches this log once the runner
          # agent is gone - but the heartbeat's own stdout is streamed
          # continuously, so anything printed here survives the kill. Hence
          # dmesg is folded into the same loop: if the OOM killer fires, the
          # reason appears in this output a moment before the runner dies.
          (
            start=$(date +%s)
            seen_oom=""
            while :; do
              printf '[%s] ' "$(date +%H:%M:%S)" >> "$disklog"
              df -Ph . 2>/dev/null | awk 'NR==2 {print $4" avail, "$3" used, "$5" ("$2" size)"}' >> "$disklog"
              elapsed=$(( $(date +%s) - start ))
              last=$(tail -n 1 "$log" 2>/dev/null | tr -d '\r' | cut -c1-140)
              printf 'heartbeat %dm%02ds | disk %s | mem avail %s | swap used %s | last: %s\n' \
                $((elapsed / 60)) $((elapsed % 60)) \
                "$(df -Ph . 2>/dev/null | awk 'NR==2 {print $4}')" \
                "$(free -m 2>/dev/null | awk '/^Mem:/ {print $7"MB"}')" \
                "$(free -m 2>/dev/null | awk '/^Swap:/ {print $3"MB"}')" \
                "$last"
              # Only shout when something new appears, so the output does not
              # fill with the same line every two minutes.
              oom=$(sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -3)
              if [ -n "$oom" ] && [ "$oom" != "$seen_oom" ]; then
                seen_oom="$oom"
                echo "=== kernel OOM evidence ==="
                printf '%s\n' "$oom"
              fi
              sleep 120
            done
          ) &
          sampler=$!

          # Record headroom up front. Run 38100739430 died at ~1h03m with
          # "No space left on device" - this line is what proves, next time,
          # whether the volume was already tight before compiling started.
          avail=$(df -Pk . 2>/dev/null | awk 'NR==2 {print $4}')
          case "$avail" in ''|*[!0-9]*) avail=0;; esac
          echo "build volume free before compile: $((avail/1024/1024))GiB" | tee -a "$log"
          if [ "$avail" -lt $((20*1024*1024)) ]; then
            echo "::warning::under 20GiB free; the build may run out of space"
          fi
          du -sh . 2>/dev/null | tee -a "$log" || true
          df -h . | tee -a "$log"

          source device/oneplus/astonc/vendorsetup.sh
          source build/envsetup.sh
          lunch twrp_astonc-bp2a-eng

          # Cap parallelism. AOSP link steps peak in the multi-GB range and an
          # OOM kill mid-build costs the whole run. `JOBS_INPUT` can be set from
          # a manual workflow_dispatch run, which means tuning it no longer
          # needs a commit - and a commit no longer risks disturbing a build
          # that is already running. Guarded with if/else rather than
          # `[ .. ] &&` because of errexit.
          jobs=4
          if [ -n "${JOBS_INPUT:-}" ]; then jobs="$JOBS_INPUT"; fi
          case "$jobs" in ''|*[!0-9]*) jobs=4;; esac
          if [ "$jobs" -lt 1 ]; then jobs=1; fi
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          ncpu=$(nproc --all)
          if [ "$jobs" -gt "$ncpu" ]; then jobs="$ncpu"; fi
          echo "building with -j$jobs (nproc=$ncpu)" | tee -a "$log"

          # Piping into tee would mask mka's own exit status, so read
          # PIPESTATUS[0] instead. `set -o pipefail` is deliberately not used:
          # the retry below must still run after a failed first attempt.
          run_build() {
            mka adbd recoveryimage -j"$jobs" 2>&1 | tee -a "$log"
            return "${PIPESTATUS[0]}"
          }

          rc=0
          run_build || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::first build attempt exited $rc; retrying once"
            echo "=== retry ===" | tee -a "$log"
            rc=0
            run_build || rc=$?
          fi

          kill "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true

          echo "=== build exit status: $rc ===" | tee -a "$log"
          df -h . | tee -a "$log"
          ls -l out/target/product/astonc/recovery.img 2>/dev/null | tee -a "$log" || true
          exit "$rc"

      - name: Verify the Wi-Fi stack is compiled in and the loader is not
        if: always()
        run: |
          # The strongest available check, and the one that would have caught
          # the original defect on its own: read the produced binary. With
          # both loader gate variables unset, kernel_module_loader.cpp is not
          # built at all, so its strings must be ABSENT - a present loader
          # here would mean a module list leaked back into the config. The
          # wlan backend must be present (OF_ENABLE_WLAN == 1), including the
          # supplicant property contract init.recovery.wifi.rc consumes.
          bin="${{ steps.vol.outputs.work }}/aera/out/target/product/astonc/system/bin/recovery"
          if [ ! -f "$bin" ]; then
            bin="${{ steps.vol.outputs.work }}/aera/out/target/product/astonc/recovery/root/system/bin/recovery"
          fi
          if [ ! -f "$bin" ]; then
            echo "::error::recovery binary not found; cannot verify the module loader"
            ls -l "${{ steps.vol.outputs.work }}/aera/out/target/product/astonc/" 2>/dev/null || true
            exit 1
          fi
          echo "verifying $bin ($(stat -c%s "$bin") bytes)"

          # Control: prove the strings scan itself works before trusting any
          # result. Measured on a real recovery binary: 46159 strings lines,
          # "recovery" 167x, "vendor" 56x, "AERA" 301x.
          if [ "$(head -c4 "$bin" | od -An -tx1 | tr -d ' \n')" != "7f454c46" ]; then
            echo "::error::recovery is not an ELF file"
            exit 1
          fi
          nstrings=$(strings -a "$bin" | wc -l)
          control=$(strings -a "$bin" | grep -c 'recovery' || true)
          echo "strings lines: $nstrings, 'recovery' occurrences: $control"
          if [ "$nstrings" -lt 5000 ] || [ "$control" -lt 20 ]; then
            echo "::error::control strings missing; the strings scan is unreliable, not the binary"
            exit 1
          fi

          fail=0
          absent() {
            if strings -a "$bin" | grep -qF -- "$1"; then
              echo "::error::still in the recovery binary: $1"
              fail=1
            else
              echo "  absent: $1"
            fi
          }
          present() {
            if strings -a "$bin" | grep -qF -- "$1"; then
              echo "  found: $1"
            else
              echo "::error::missing from recovery binary: $1"
              fail=1
            fi
          }

          echo "--- module loader (must be compiled out) ---"
          absent "Attempting to load modules"
          absent "Checking directory: "
          absent "Modules Loaded: "
          absent "modules.load.twrp"
          absent "Staging post-decrypt modules"
          absent "astonc: staging post-decrypt modules on demand"

          echo "--- wlan.cpp / supplicant path (must be present) ---"
          present "wpa_supplicant"
          present "sys.aera.wlan.up"

          if [ "$fail" -ne 0 ]; then
            echo "::error::the recovery binary's module-loader / Wi-Fi composition is wrong"
            exit 1
          fi
          echo "recovery binary: loader compiled out, Wi-Fi stack present"

      - name: Verify the VINTF decrypt fix reached the ramdisk
        if: always()
        run: |
          # The check whose absence cost the most, and the reason it has to be
          # here rather than in the source tree: fix-recovery-vintf.py runs from
          # BOARD_RECOVERY_IMAGE_PREPARE, i.e. after the ramdisk is assembled, so
          # the source files being right says nothing about the image.
          #
          # What it prevents: AOSP ServiceManager.cpp::isVintfDeclared rejects
          # addService() for any AIDL interface it cannot find in a manifest it
          # can read. keystore2 treats EX_ILLEGAL_ARGUMENT as fatal, aborts with
          # signal 6, and Decrypt_DE() retries forever. The image flashes and
          # boots normally, so nothing before a device-side test reveals it.
          root="${{ steps.vol.outputs.work }}/aera/out/target/product/astonc/recovery/root"
          if [ ! -d "$root" ]; then
            echo "recovery ramdisk tree not found at $root; skipping"
            exit 0
          fi
          fail=0

          # 1. The manifest servicemanager actually reads. VintfObject.cpp:460
          #    parses the framework fragment directory only if this file exists,
          #    so if it is missing the fallback is a manifest that declares no
          #    AIDL HAL at all and every framework AIDL registration fails.
          main="$root/system/manifest.xml"
          echo "--- framework manifest ---"
          if [ ! -f "$main" ]; then
            echo "::error::$main missing; the framework manifest falls back to one that declares no AIDL hal"
            fail=1
          else
            for s in '<name>android.system.keystore2</name>' \
                     'IKeystoreService/default' \
                     '<name>android.hardware.boot</name>' \
                     'IBootControl/default' \
                     'format="aidl"'; do
              if grep -qF -- "$s" "$main"; then
                echo "  declared: $s"
              else
                echo "::error::$main does not declare $s; keystore2 aborts before Decrypt_DE can succeed"
                fail=1
              fi
            done
            if [ "$(grep -c '</manifest>' "$main" || true)" != "1" ]; then
              echo "::error::$main does not have exactly one closing </manifest>"
              fail=1
            fi
          fi

          # 2. The fragments libvintf parses. AIDL HALs are read from <fqname>;
          #    the HIDL <interface><name>/<instance> shape is silently dropped,
          #    and a device-typed fragment inside the framework directory is
          #    discarded entirely.
          echo "--- framework fragments ---"
          for f in android.system.keystore2-service.xml \
                   android.hardware.boot-service.default.xml; do
            p="$root/system/etc/vintf/manifest/$f"
            if [ ! -f "$p" ]; then
              echo "::error::fragment missing from the ramdisk: $p"
              fail=1
              continue
            fi
            if ! grep -qF 'type="framework"' "$p"; then
              echo "::error::$p is not type=framework; libvintf drops it"
              fail=1
            fi
            if ! grep -qF '<fqname>' "$p"; then
              echo "::error::$p declares no <fqname>; an AIDL hal declared with <interface> is discarded"
              fail=1
            fi
            echo "  ok: $f"
          done

          # 3. init can only lazy-start a service it has an interface name for.
          #    Without this line `setprop ctl.interface_start aidl/...` fails with
          #    "Control message: Could not find ... for ctl.interface_start".
          echo "--- keystore2.rc ---"
          krc="$root/system/etc/init/keystore2.rc"
          if [ ! -f "$krc" ]; then
            echo "::error::keystore2.rc missing from the ramdisk"
            fail=1
          elif ! grep -qF 'interface aidl android.system.keystore2.IKeystoreService/default' "$krc"; then
            echo "::error::keystore2.rc has no 'interface aidl' line; ctl.interface_start aidl/... will fail"
            fail=1
          else
            echo "  ok: interface aidl declared"
          fi

          # 4. A CRLF manifest is not parsed, and the resulting error points at
          #    the interface rather than at the line ending.
          for p in "$main" \
                   "$root/system/etc/vintf/manifest/android.system.keystore2-service.xml" \
                   "$root/system/etc/vintf/manifest/android.hardware.boot-service.default.xml" \
                   "$krc"; do
            [ -f "$p" ] || continue
            if grep -qU $'\r' "$p"; then
              echo "::error::$p contains CR characters; libvintf/init will not parse it"
              fail=1
            fi
          done
          echo "no CR characters in the VINTF files"

          if [ "$fail" -ne 0 ]; then
            echo "::error::the VINTF decrypt fix did not reach the ramdisk; this image cannot decrypt /data"
            exit 1
          fi
          echo "the ramdisk carries the VINTF decrypt fix"

      - name: Verify the ramdisk stages the Wi-Fi init script and binaries
        if: always()
        run: |
          # The source-tree check in the configuration step reads the device
          # tree. This one reads the assembled ramdisk, which is a different
          # artifact: AERA's own prebuilt etc/ install and
          # BOARD_RECOVERY_IMAGE_PREPARE both write into recovery/root, and
          # AERA's relink_binaries copies whatever RECOVERY_BINARY_SOURCE_FILES
          # names by basename. A missing file here is a missing feature at the
          # device, whatever the sources said.
          root="${{ steps.vol.outputs.work }}/aera/out/target/product/astonc/recovery/root"
          if [ ! -d "$root" ]; then
            echo "recovery ramdisk tree not found at $root; skipping"
            exit 0
          fi
          fail=0

          if [ -f "$root/init.recovery.wifi.rc" ]; then
            echo "  staged: init.recovery.wifi.rc ($(stat -c%s "$root/init.recovery.wifi.rc") bytes)"
          else
            echo "::error::init.recovery.wifi.rc did not reach the recovery ramdisk"
            fail=1
          fi

          # A CRLF shebang makes a script unrunnable on the device, and the
          # failure is a bare "not found" that points nowhere near the cause.
          for f in init.recovery.wifi.rc init.recovery.qcom.rc; do
            [ -f "$root/$f" ] || continue
            if head -c2 "$root/$f" | grep -q $'\r' || grep -qU $'\r' "$root/$f"; then
              echo "::error::$f contains CR characters; init would misparse it"
              fail=1
            fi
          done

          # wpa_supplicant / wpa_cli / dhcptool are staged by aera_build.mk only
          # when OF_ENABLE_WLAN == 1. Their absence means that gate never fired,
          # which is the failure a config-only check cannot see.
          for b in system/bin/wpa_supplicant system/bin/wpa_cli system/bin/dhcptool; do
            if [ -e "$root/$b" ]; then
              echo "  staged: $b ($(stat -c%s "$root/$b") bytes)"
            else
              echo "::error::$b is missing from the ramdisk; OF_ENABLE_WLAN did not reach the packaging"
              fail=1
            fi
          done

          # The supplicant VINTF manifest is staged by the Wi-Fi block's own
          # rule; servicemanager needs it for the supplicant HAL registration.
          if [ -e "$root/vendor/etc/vintf/manifest/android.hardware.wifi.supplicant.xml" ]; then
            echo "  staged: vendor/etc/vintf/manifest/android.hardware.wifi.supplicant.xml"
          else
            echo "::error::the supplicant VINTF manifest did not reach the ramdisk"
            fail=1
          fi

          # The loader-era hook must not reappear through AERA's own prebuilt
          # install or relink_binaries.
          if [ -e "$root/system/bin/beforemodules.sh" ]; then
            echo "::error::beforemodules.sh reached the ramdisk although the loader it serves is compiled out"
            fail=1
          fi

          echo "--- what is in system/bin/ ---"
          ls "$root/system/bin/" 2>/dev/null || true

          if [ "$fail" -ne 0 ]; then
            echo "::error::the Wi-Fi ramdisk artifacts are incomplete"
            exit 1
          fi
          echo "the ramdisk stages the Wi-Fi init script and the supplicant binaries"

      - name: Verify the Menu revert, the Root Manager payload and the fastboot closure
        if: always()
        run: |
          # Three separate regressions that all present as "a feature is
          # missing/broken at the device" and none of which any earlier step can
          # see. All three were observed on a real flashed build.
          #
          #   a) Menu slot 9. Upstream b9eddda replaced the Language row with a
          #      PC connection row. Step "Apply upstream source fixes" reverts it
          #      in the source; this reads the compiled literal, because only the
          #      binary proves the revert survived the compile.
          #      The discriminator strings are exact and were cross-checked
          #      against two real binaries: a verified pre-b9eddda recovery
          #      carries "Choose the recovery interface language" x1 and
          #      "Transfer and install ZIPs and images from your computer" x0,
          #      while the PC-connection build is the mirror image (x0 and x1).
          #      Both literals come only from the Menu row in the new build, so
          #      the check is not fooled by the Preferences Language row, which
          #      b9eddda keeps and which uses the short string "Language".
          #
          #   b) Root Manager payload. AERA_ENABLE_ROOT_MANAGER=1 gates both the
          #      Menu row (tool_scene.cpp) and the copy of
          #      prebuilt/aera/root into system/etc/aera/root-providers
          #      (aera_build.mk). The device tree sets it, so both must be
          #      present. The providers ride along because the flag is a single
          #      on/off for all three.
          #
          #      Read the strings carefully: the Menu row's own text
          #      ("Patch init_boot and manage KernelSU modules") CANNOT be used
          #      here. It is static array data in tool_scene.cpp, so it is in the
          #      binary whether or not the feature is on -- measured x1 on a real
          #      build with AERA_ENABLE_ROOT_MANAGER=0. The strings that do
          #      discriminate come from root_manager.cpp, and they are absent
          #      when the flag is 0 because root::Enabled() is
          #      `inline constexpr bool` returning a literal through #if, which
          #      makes the Probe()/Run() early return unconditional and lets the
          #      compiler delete everything downstream -- including
          #      LoadBundledRelease() and the kBundledRoot path constant.
          #      Measured across two real binaries: a build with the flag on
          #      carries root-providers x2, sukisu-ultra x1 and kernelsu-next x1;
          #      the flag-off build carries x0 of each. So presence here is a
          #      sound assertion and absence is the exact failure this device hit.
          #
          #   c) fastboot closure. "Reboot to bootloader" lands back in recovery
          #      on this port, and the reason is that the reboot target is
          #      written to /misc while the userspace fastboot gadget is only
          #      bound by an upstream init.rc action whose trigger depends on
          #      sys.usb.ffs.ready. This check does not prove fastboot works on
          #      the device -- only a device test can -- but it does pin the
          #      closure, so a build that silently drops fastbootd, the fastboot
          #      HAL stubs, the gadget function or the /misc fstab entry fails
          #      here instead of after a flash.
          work="${{ steps.vol.outputs.work }}"
          root="$work/aera/out/target/product/astonc/recovery/root"
          bin="$work/aera/out/target/product/astonc/system/bin/recovery"
          if [ ! -f "$bin" ]; then
            bin="$root/system/bin/recovery"
          fi
          if [ ! -f "$bin" ]; then
            echo "::error::recovery binary not found; cannot verify the Menu"
            exit 1
          fi
          fail=0

          echo "--- Menu slot 9 (want the Language row) ---"
          # Only the positive direction is checkable from the binary.
          #
          # "Choose the recovery interface language" is used by exactly one
          # thing in the whole tree: the Menu Language row. It also appears in
          # the localization catalog, but that ships as a compressed kData[]
          # blob (catalog_generated.cpp), so it is not a plain string in the
          # image -- measured x0 on the run that had the PC connection row and
          # x1 on a build from before the Menu was changed. Presence is therefore
          # a sound signal that the revert reached the compiled array.
          #
          # The negative direction is NOT checkable here, and asserting on it
          # would fail every build: the PC row's own description
          # ("Transfer and install ZIPs and images from your computer") is shared
          # with BuildPcConnection() in the same file and with the PC pairing
          # panel in engine.cpp, neither of which the revert touches. That string
          # is x1 in the PC-connection build and would still be x1 after the
          # revert. The absence of the PC row is enforced at the source level by
          # scripts/restore-menu-language.py and re-checked right after it runs.
          n_lang=$(strings -a "$bin" | grep -cF 'Choose the recovery interface language' || true)
          n_pcnote=$(strings -a "$bin" | grep -cF 'Transfer and install ZIPs and images from your computer' || true)
          echo "  'Choose the recovery interface language'                  x$n_lang (want >= 1)"
          echo "  'Transfer and install ZIPs and images ...'                  x$n_pcnote (shared with PC panels; not a signal)"
          if [ "$n_lang" -lt 1 ]; then
            echo "::error::the Menu Language row is not in the recovery binary; the PC connection revert did not take effect"
            fail=1
          fi

          echo "--- Root Manager compiled in (want the provider strings) ---"
          n_rp=$(strings -a "$bin" | grep -cF 'root-providers' || true)
          n_su=$(strings -a "$bin" | grep -cF 'sukisu-ultra' || true)
          n_kn=$(strings -a "$bin" | grep -cF 'kernelsu-next' || true)
          echo "  'root-providers'  x$n_rp   'sukisu-ultra'  x$n_su   'kernelsu-next'  x$n_kn (want >= 1 each)"
          if [ "$n_rp" -lt 1 ] || [ "$n_su" -lt 1 ] || [ "$n_kn" -lt 1 ]; then
            echo "::error::the Root Manager provider paths were dead-code-eliminated; AERA_ENABLE_ROOT_MANAGER is 0 at compile time"
            echo "          (the Menu row text is NOT a usable signal -- it is static array data and is present either way)"
            fail=1
          fi
          # The runtime property is written on both branches of the #if, so it
          # only proves data.cpp was compiled -- logged for the record.
          n_prop=$(strings -a "$bin" | grep -cF 'ro.aera.root_manager.enabled' || true)
          echo "  'ro.aera.root_manager.enabled'  x$n_prop (informational)"

          echo "--- Root Manager offline providers (want present) ---"
          if [ -d "$root/system/etc/aera/root-providers" ]; then
            count=$(find "$root/system/etc/aera/root-providers" -type f | wc -l)
            echo "  root-providers: $count files"
            find "$root/system/etc/aera/root-providers" -type f | sed 's|^|    |' | sort
            if [ "$count" -lt 13 ]; then
              echo "::error::expected the 12 provider payloads plus providers.json, found $count"
              fail=1
            fi
            for p in providers.json kernelsu kernelsu-next sukisu-ultra; do
              if [ ! -e "$root/system/etc/aera/root-providers/$p" ]; then
                echo "::error::$p is missing from root-providers"
                fail=1
              fi
            done
          else
            echo "::error::system/etc/aera/root-providers is absent; AERA_ENABLE_ROOT_MANAGER did not reach aera_build.mk"
            fail=1
          fi
          if [ -f "$root/system/etc/aera/.root-providers.stamp" ] || [ -f "$root/system/etc/aera/.root-providers" ]; then
            echo "  note: the packaging stamp is present (expected, it is how the rule is tracked)"
          fi

          echo "--- fastboot closure (want present) ---"
          for f in system/bin/fastbootd \
                   system/lib64/android.hardware.fastboot@1.0.so \
                   system/lib64/android.hardware.fastboot@1.1.so \
                   system/lib64/android.hardware.fastboot-V1-ndk.so \
                   system/etc/init/hw/init.rc \
                   system/etc/recovery.fstab; do
            if [ -e "$root/$f" ]; then
              echo "  present: $f"
            else
              echo "::error::missing from the ramdisk: $f (fastboot would be unreachable)"
              fail=1
            fi
          done
          # The gadget function and its bind trigger live in the shared init.rc.
          # Both are required: the function is created on post-fs and the UDC is
          # only bound from the sys.usb.config=fastboot action.
          if ! grep -q 'functions/ffs.fastboot' "$root/system/etc/init/hw/init.rc"; then
            echo "::error::init.rc no longer creates functions/ffs.fastboot; the fastboot gadget cannot enumerate"
            fail=1
          fi
          if ! grep -q 'sys.usb.config=fastboot' "$root/system/etc/init/hw/init.rc"; then
            echo "::error::init.rc no longer has the sys.usb.config=fastboot action; the UDC is never bound as fastboot"
            fail=1
          fi
          # /misc has to stay in the fstab: the bootloader reboot target is
          # written there by init (libbootloader_message), and a member that is
          # not in the fstab cannot be written by the recovery.
          if ! grep -qE '^[^#]*[[:space:]]/misc[[:space:]]' "$root/system/etc/recovery.fstab"; then
            echo "::error::/misc is not in recovery.fstab; the bootloader reboot target cannot be written"
            fail=1
          fi
          echo "  init.rc gadget + fastboot trigger + /misc fstab: ok"

          #   d) Power handoff. The BCB clear (fix-reboot-fastboot.py) lets
          #      init *accept* the reboot request, but the graphics thread has
          #      to *deliver* it. Without the power handoff repair the early UI
          #      thread exits and runs Adreno EGL TLS destructors that block
          #      before request_power_control() is reached, so the device stays
          #      in recovery. The marker string proves the patch survived the
          #      compile; measured x1 on a patched binary, x0 on an unpatched
          #      one.
          echo "--- power handoff marker (want present) ---"
          n_ph=$(strings -a "$bin" | grep -cF 'terminal action handed off with graphics thread alive' || true)
          echo "  'terminal action handed off...'  x$n_ph (want >= 1)"
          if [ "$n_ph" -lt 1 ]; then
            echo "::error::the power handoff marker is absent from the recovery binary; fix-power-handoff.py did not reach the compile"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::the Menu revert, the Root Manager payload, the fastboot closure or the power handoff is incomplete"
            exit 1
          fi
          echo "Menu Language restored, Root Manager packaged, fastboot closure intact, power handoff embedded"

      - name: Show disk curve and build log tail
        if: always()
        run: |
          # The REST job-log endpoint for this repo returns 401/404, so the
          # step output is the only channel that survives. Echo the free-space
          # curve and the last stretch of the captured build log into it.
          work="${{ steps.vol.outputs.work }}"
          echo "=== free space over the compile ==="
          if [ -s "$work/disk.log" ]; then cat "$work/disk.log"; else echo "(no samples)"; fi

          log="$work/build.log"
          if [ ! -s "$log" ]; then
            echo "no captured build log at $log"
            exit 0
          fi
          echo "=== $log: $(wc -l < "$log") lines ==="
          echo "=== first 40 ==="
          head -40 "$log"
          echo "=== last 150 ==="
          tail -150 "$log"
          echo "=== error lines (max 60) ==="
          grep -nE '(error:|Error:|ERROR|FAILED|ninja: build stopped|No space left|Killed|undefined reference)' "$log" \
            | tail -60 || true

      - name: Show ccache stats
        if: always()
        run: ccache -s || true

      - name: Disk usage after build
        if: always()
        run: |
          df -h
          aera="${{ steps.vol.outputs.work }}/aera"
          # Report the two consumers separately. Without this the next failure
          # is another guess about where the space went: .repo is git objects
          # for the whole manifest, out/ is compiler output.
          du -sh "$aera/.repo" 2>/dev/null || true
          du -sh "$aera/out" 2>/dev/null || true
          du -sh "$aera" 2>/dev/null || true
          echo "--- largest directories under out/ ---"
          du -sh "$aera/out"/* 2>/dev/null | sort -rh | head -5 || true
          echo "--- recovery image ---"
          ls -l "$aera/out/target/product/astonc/recovery.img" 2>/dev/null || \
            echo "no recovery.img"

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aera-recovery-astonc
          path: |
            ${{ steps.vol.outputs.work }}/aera/out/target/product/astonc/recovery.img
            ${{ steps.vol.outputs.work }}/aera/out/target/product/astonc/*.img
          if-no-files-found: warn
          retention-days: 14