name: Build AERA Recovery (astonc)

on:
  workflow_dispatch:
  push:
    branches: [main, aera-16.0]
    paths-ignore:
      - 'README.md'
      - '*.md'

permissions:
  contents: read

# A newer push supersedes the running build. Without this, pushing several
# commits in a row leaves one run per push all racing through the same
# serialized `repo sync`, and the stale ones have to be cancelled by hand.
# `github.ref` keeps main and aera-16.0 independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Set up vendor-blobs deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOBS_DEPLOY_KEY }}

      - name: Fetch vendor crypto blobs
        run: |
          # Proprietary QTI security ELFs (qseecomd, keymint, gatekeeper and
          # their lib closure) required for FBE decryption. They are OEM
          # binaries, so they live in the private astonc-vendor-blobs repo and
          # are injected here at build time. The device tree .gitignore keeps
          # recovery/root/vendor/bin and vendor/lib64 out of this public repo.
          git clone --depth 1 \
            git@github.com:kexi1412/astonc-vendor-blobs.git \
            "$RUNNER_TEMP/blobs"
          mkdir -p device_tree/recovery/root/vendor
          cp -a "$RUNNER_TEMP/blobs/vendor/." device_tree/recovery/root/vendor/
          echo "vendor/bin:"; ls device_tree/recovery/root/vendor/bin
          echo "vendor/bin/hw:"; ls device_tree/recovery/root/vendor/bin/hw
          echo "vendor/lib64 count: $(ls device_tree/recovery/root/vendor/lib64 | wc -l)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            python3 python3-pip rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev openjdk-11-jdk
          git lfs install --skip-repo || true
          echo "ccache: $(ccache --version | head -1)"

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git and ccache
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global color.ui false
          # The AERA manifest declares the AERA remote over SSH
          # (ssh://git@github.com/AERA-Recovery). The repositories are public,
          # so rewrite to HTTPS.
          git config --global url."https://github.com/AERA-Recovery".insteadOf "ssh://git@github.com/AERA-Recovery"
          ccache -M 30G
          ccache -z

      - name: Add swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Repo init and sync (AERA manifest, aera-16.0)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/aera"
          cd "$GITHUB_WORKSPACE/aera"
          repo init -u https://github.com/AERA-Recovery/android_manifest.git \
            -b aera-16.0 --git-lfs --depth=1
          repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc --all)"

      - name: Install device tree
        run: |
          cd "$GITHUB_WORKSPACE/aera"
          rm -rf device/oneplus/astonc
          mkdir -p device/oneplus
          cp -a "$GITHUB_WORKSPACE/device_tree" device/oneplus/astonc
          rm -rf device/oneplus/astonc/.github device/oneplus/astonc/.git
          ls device/oneplus/astonc

      - name: Apply upstream source fixes
        run: |
          cd "$GITHUB_WORKSPACE/aera"
          # AERA's partitionmanager.cpp references AID_MEDIA_RW without
          # including the header that declares it (data.cpp and
          # twrp-functions.cpp, which use the same symbol, both include it).
          # Reported by run #2 (37608320847): "use of undeclared identifier
          # 'AID_MEDIA_RW'" at partitionmanager.cpp:1632 and :5401.
          f=bootable/recovery/partitionmanager.cpp
          if ! grep -q 'android_filesystem_config.h' "$f"; then
            sed -i '0,/^#include <fstab\/fstab.h>/s//#include <private\/android_filesystem_config.h>\n#include <fstab\/fstab.h>/' "$f"
            echo "patched $f:"
            grep -n 'android_filesystem_config.h' "$f"
          else
            echo "$f already includes android_filesystem_config.h"
          fi

      - name: Build recovery
        run: |
          cd "$GITHUB_WORKSPACE/aera"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source device/oneplus/astonc/vendorsetup.sh
          source build/envsetup.sh
          lunch twrp_astonc-bp2a-eng
          mka adbd recoveryimage -j"$(nproc --all)" || mka adbd recoveryimage

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aera-recovery-astonc
          path: |
            aera/out/target/product/astonc/recovery.img
            aera/out/target/product/astonc/*.img
          if-no-files-found: warn
          retention-days: 14
